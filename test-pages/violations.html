<!doctype html>
<!-- A page with known accessibility violations, used to check the extension.
     The expected scan result is listed in test-pages/README.md.
     The missing lang attribute on <html> is one of the violations. -->
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Known accessibility violations</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 24px;
        color: #111;
        background: #fff;
      }
      .low-contrast {
        color: #aaa;
      }
      .swatch {
        display: inline-block;
        width: 120px;
        height: 60px;
        background: #1e3d7a;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Known accessibility violations</h1>
      <p><a href="clean.html">Go to the page without violations</a></p>

      <!-- image-alt: image without alternative text -->
      <img
        id="swatch"
        class="swatch"
        src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
      />

      <!-- button-name: button without an accessible name -->
      <button type="button" id="icon-button"></button>

      <!-- label: form field without a label -->
      <input type="text" id="search" />

      <!-- color-contrast: light grey text on white -->
      <p id="low-contrast" class="low-contrast">This text is too light to read comfortably.</p>

      <!-- link-name: link without text -->
      <a href="https://example.com/" id="empty-link"></a>

      <!-- heading-order: h1 followed by h3 -->
      <h3 id="skipped-level">A heading that skips a level</h3>

      <!-- empty-heading: heading without content -->
      <h2 id="empty-heading"></h2>
    </main>

    <!-- region: content outside of any landmark -->
    <div id="outside-landmark">This text is not inside a landmark.</div>
  </body>
</html>
